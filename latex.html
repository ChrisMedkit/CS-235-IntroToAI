<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Christopia: LaTeX Scratchpad</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Christopia</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        Menu
      </button>
      <nav id="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="plotter.html">Plotter</a></li>
          <li><a href="scanner.html">Scanner</a></li>
          <li><a href="matrix.html">Matrix Lab</a></li>
          <li><a href="latex.html">LaTeX</a></li>
          <li><a href="hub.html">Hub</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    </header>

    <main class="tool-layout">
      <section id="latex-editor" aria-labelledby="latex-heading">
        <h1 id="latex-heading">LaTeX Scratchpad</h1>
        <label for="latex-source">Source (text with $inline$ and $$display$$ math)</label>
        <textarea id="latex-source" rows="18" spellcheck="false">
The quadratic formula: $x = \frac{-b \pm \sqrt{b^2-4ac}}{2a}$</textarea
        >
        <div class="button-row">
          <button type="button" id="load-scan">Load last scan</button>
          <button type="button" id="download-tex">Download .tex</button>
          <button type="button" id="clear-latex">Clear</button>
        </div>
      </section>

      <section id="latex-preview-section" aria-labelledby="preview-heading">
        <h2 id="preview-heading">Preview</h2>
        <div id="latex-preview" aria-live="polite"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Christopia. TODO: footer text / GitHub link.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/latex.js"></script>
  </body>
</html>
