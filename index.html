<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Christopia</title>
    <meta
      name="description"
      content="Christopia: a hub of math, computer science and social tools."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap"
    />
    <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.21/dist/98.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="splash-page" data-root="">
    <main class="splash-main">
      <div class="title-wrap">
        <h1 class="chrome-title">Christopia</h1>
        <p class="splash" aria-hidden="true">Now in 3D!</p>
      </div>
      <p class="splash-subtitle">Come in and get ur mind blown</p>
      <!-- CD-ROM autorun: the disc spins; clicking it "runs" the site. Swap the disc art in images/stickers/cd.svg. -->
      <a class="autorun" href="home.html">
        <img src="images/stickers/cd.svg" alt="" width="160" height="160" />
        <span class="autorun-label">Click to run <strong>Christopia.exe</strong></span>
      </a>
      <p class="splash-note">best viewed in any browser &middot; est. 2026</p>
    </main>

    <script type="module" src="js/script.js"></script>
  </body>
</html>
