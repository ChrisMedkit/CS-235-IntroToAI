<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Christopia: Function Plotter</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="index.html">Christopia</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        Menu
      </button>
      <nav id="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="plotter.html">Plotter</a></li>
          <li><a href="scanner.html">Scanner</a></li>
          <li><a href="matrix.html">Matrix Lab</a></li>
          <li><a href="latex.html">LaTeX</a></li>
          <li><a href="hub.html">Hub</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" type="button" aria-pressed="false">Dark mode</button>
    </header>

    <main class="tool-layout">
      <section id="plot-controls" aria-labelledby="plot-heading">
        <h1 id="plot-heading">Function Plotter</h1>

        <fieldset class="mode-switch">
          <legend>Mode</legend>
          <label><input type="radio" name="mode" value="2d" checked /> 2D: y = f(x)</label>
          <label><input type="radio" name="mode" value="3d" /> 3D: z = f(x, y)</label>
        </fieldset>

        <!-- Expression list, Desmos-style: one row per function.
             TODO (Step 7): addExpressionRow() in js/plotter.js clones this row. -->
        <ol id="expression-list">
          <li class="expression-row">
            <label for="expr-0">f<sub>1</sub></label>
            <input id="expr-0" type="text" value="sin(x)" spellcheck="false" />
            <button type="button" class="remove-expr" aria-label="Remove f1">&times;</button>
          </li>
        </ol>
        <button type="button" id="add-expr">Add function</button>

        <fieldset class="ranges">
          <legend>Window</legend>
          <label>x min <input id="x-min" type="number" value="-10" /></label>
          <label>x max <input id="x-max" type="number" value="10" /></label>
          <label>y min <input id="y-min" type="number" value="-10" /></label>
          <label>y max <input id="y-max" type="number" value="10" /></label>
        </fieldset>

        <p id="plot-error" class="error" role="alert"></p>
      </section>

      <section id="plot-area" aria-label="Graph">
        <!-- Plotly draws here. -->
        <div id="plot"></div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 Christopia. TODO: footer text / GitHub link.</p>
    </footer>

    <!-- Pinned CDN libraries (spec allows external libs as long as the shared JS file exists). -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/13.2.0/math.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <script type="module" src="js/script.js"></script>
    <script type="module" src="js/plotter.js"></script>
  </body>
</html>
