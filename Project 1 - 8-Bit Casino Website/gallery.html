<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Screenshots from around Longshot." />
    <title>Gallery | Longshot</title>
    <!-- Inline gold-chip favicon: no extra file, and no favicon.ico 404 -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%230b0d10'/%3E%3Ccircle cx='8' cy='8' r='5' fill='%23f5c542'/%3E%3C/svg%3E" />
    <!-- Inter (Google Fonts); falls back to the system font offline -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <!-- Shared header + nav: identical to index.html except aria-current. -->
    <header class="site-header">
      <a class="site-logo" href="index.html">Long<span>shot</span></a>
      <nav class="site-nav" aria-label="Main">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="play.html">Play</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="gallery.html" aria-current="page">Gallery</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="gallery" class="gallery">
        <h1>Gallery</h1>
        <p>Screenshots from around Longshot. Select a picture to see it full size.</p>

        <!-- Six thumbnails. Each is a <button> so Tab + Enter opens it; script.js (Step 7)
             reads the <img> inside for the lightbox and uses its alt text as the caption.
             TODO: add these files to images/ and update each alt to match your art. -->
        <ul class="gallery-grid">
          <li>
            <button class="gallery-item" type="button">
              <img src="images/game-1.png" alt="Longshot home page with the featured race odds board" width="320" height="240" />
            </button>
          </li>
          <li>
            <button class="gallery-item" type="button">
              <img src="images/game-2.png" alt="Horses racing down the home stretch" width="320" height="240" />
            </button>
          </li>
          <li>
            <button class="gallery-item" type="button">
              <img src="images/game-3.png" alt="Slot machine showing three matching cherries" width="320" height="240" />
            </button>
          </li>
          <li>
            <button class="gallery-item" type="button">
              <img src="images/game-4.png" alt="Blackjack table with a player hand totaling 21" width="320" height="240" />
            </button>
          </li>
          <li>
            <button class="gallery-item" type="button">
              <img src="images/game-5.png" alt="Roulette wheel with the ball landing on red" width="320" height="240" />
            </button>
          </li>
          <li>
            <button class="gallery-item" type="button">
              <img src="images/game-6.png" alt="Prize booth with a tall stack of play-money chips" width="320" height="240" />
            </button>
          </li>
        </ul>
      </section>

      <!-- Lightbox (Step 7). <dialog> gives Esc-to-close and focus trapping for free. -->
      <dialog id="lightbox" class="lightbox" aria-label="Image viewer">
        <!-- No src until script.js sets one (an empty src is invalid HTML). -->
        <img id="lightbox-image" alt="" />
        <p id="lightbox-caption" class="lightbox-caption"></p>
        <button id="lightbox-prev" class="btn" type="button" aria-label="Previous image">&lsaquo;</button>
        <button id="lightbox-next" class="btn" type="button" aria-label="Next image">&rsaquo;</button>
        <button id="lightbox-close" class="btn" type="button" aria-label="Close">&times;</button>
      </dialog>
    </main>

    <footer class="site-footer">
      <p>&copy; 2026 TODO: Your Name &middot; Longshot uses play money only, for fun.</p>
    </footer>

    <script src="js/script.js"></script>
  </body>
</html>
